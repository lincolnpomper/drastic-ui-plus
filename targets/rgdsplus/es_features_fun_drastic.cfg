<?xml version="1.0"?>
<features>
    <emulator name="DraStic UI Plus">
        <cores>
            <core name="DraStic UI Plus">
                <features>
                    <feature name="LCD Filter" value="fun_drastic_shader" submenu="LCD Filter"
                             description="Auto uses the LCD Grid when DraStic is set to LCD3x.">
                        <choice name="LCD Grid" value="lcd3x"/>
                        <choice name="RetroArch LCD1x" value="retroarch-lcd1x"/>
                        <choice name="RetroArch LCD3x" value="retroarch-lcd3x"/>
                        <choice name="Off" value="none"/>
                    </feature>
                    <feature name="Intensity" value="fun_drastic_lcd_intensity" submenu="LCD Filter"
                             description="Applies to all LCD filters. Auto uses Original.">
                        <choice name="Soft" value="soft"/>
                        <choice name="Medium" value="medium"/>
                        <choice name="Original" value="original"/>
                        <choice name="Strong" value="strong"/>
                    </feature>
                    <feature name="Brighten Scanlines" value="fun_drastic_brighten_scanlines"
                             submenu="LCD Filter" preset="sliderauto" preset-parameters="1 32 0.5"
                             description="RetroArch LCD1x and LCD3x. Lower values darken horizontal lines. Auto uses 16."/>
                    <feature name="Brighten LCD" value="fun_drastic_brighten_lcd"
                             submenu="LCD Filter" preset="sliderauto" preset-parameters="1 12 0.1"
                             description="RetroArch LCD1x and LCD3x. Lower values strengthen the vertical mask. Auto uses 4."/>
                </features>
            </core>
        </cores>
    </emulator>
</features>
