<?xml version="1.0"?>
<systemList>
    <system>
        <name>nds</name>
        <emulators>
            <emulator name="drastic">
                <cores>
                    <core default="true">drastic-sa</core>
                </cores>
            </emulator>
            <emulator name="retroarch">
                <cores>
                    <core>melonds</core>
                    <core>melondsds</core>
                    <core>desmume</core>
                    <core>skyemu</core>
                </cores>
            </emulator>
            <emulator name="melonds">
                <cores>
                    <core>melonds-sa</core>
                </cores>
            </emulator>
            <emulator name="dsperate">
                <cores>
                    <core>dsperate-sa</core>
                </cores>
            </emulator>
            <emulator name="DraStic UI Plus" command="/storage/drastic-ui-plus/launch-rom.sh %ROM%">
                <cores>
                    <core>DraStic UI Plus</core>
                </cores>
            </emulator>
        </emulators>
    </system>
</systemList>
